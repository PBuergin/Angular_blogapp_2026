<div class="toolbar">
  <button mat-icon-button type="button" (click)="toggleTheme()">
    @if (isDarkMode) {
      <mat-icon>light_mode</mat-icon>
    } @else {
      <mat-icon>dark_mode</mat-icon>
    }
  </button>
</div>

<h1>Blog Übersicht</h1>

<div class="blog-list">
  @for (blog of blogs(); track blog.id) {
    <app-blog-card [model]="blog" (liked)="toggleLike($event)"> </app-blog-card>
  } @empty {
    <p>Keine Blog-Posts vorhanden.</p>
  }
</div>
